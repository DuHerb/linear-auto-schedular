# Scheduler preferences. Source of truth for user-level scheduling behavior.
# scheduler-state MCP loads this on every tool call that needs it.

timezone: America/Los_Angeles

working_hours:
  monday:    { start: "09:00", end: "18:00" }
  tuesday:   { start: "09:00", end: "18:00" }
  wednesday: { start: "09:00", end: "18:00" }
  thursday:  { start: "09:00", end: "18:00" }
  friday:    { start: "09:00", end: "18:00" }

defaults:
  session_min_minutes: 30
  session_max_minutes: 120
  break_after_minutes: 120
  break_duration_minutes: 15
  buffer_around_meetings_minutes: 5

fixed_blocks:
  - name: lunch
    days: [mon, tue, wed, thu, fri]
    start: "12:00"
    duration_minutes: 60
    type: block

  - name: workout
    days: [mon, wed, fri]
    window_start: "13:00"
    window_end: "17:00"
    duration_minutes: 30
    type: flexible

  - name: office_hours
    days: [mon, tue, wed, thu, fri]
    start: "09:00"
    duration_minutes: 30
    type: block

calendars:
  # TODO: replace with your real Gmail/Workspace email during pre-flight
  primary_email: "you@example.com"
  # TODO: replace with the Focus Sessions calendar ID (looks like
  # c_abcd1234@group.calendar.google.com), captured per docs/google-oauth-setup.md §Step 8
  agent_writes_to: "REPLACE_WITH_FOCUS_SESSIONS_CALENDAR_ID"
