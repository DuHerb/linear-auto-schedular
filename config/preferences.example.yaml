# Scheduler preferences EXAMPLE template.
#
# Copy this file to `config/preferences.yaml` and fill in real values.
# The real file is gitignored — never commit it. Source of truth for
# user-level scheduling behavior; scheduler-state MCP loads it on every
# tool call that needs it.

timezone: America/Los_Angeles

working_hours:
  monday:    { start: "09:00", end: "18:00" }
  tuesday:   { start: "09:00", end: "18:00" }
  wednesday: { start: "09:00", end: "18:00" }
  thursday:  { start: "09:00", end: "18:00" }
  friday:    { start: "09:00", end: "18:00" }

defaults:
  session_min_minutes: 30
  session_max_minutes: 120
  break_after_minutes: 120
  break_duration_minutes: 15
  buffer_around_meetings_minutes: 5

fixed_blocks:
  - name: lunch
    days: [mon, tue, wed, thu, fri]
    start: "12:00"
    duration_minutes: 60
    type: block

  - name: workout
    days: [mon, wed, fri]
    window_start: "13:00"
    window_end: "17:00"
    duration_minutes: 30
    type: flexible

  - name: office_hours
    days: [mon, tue, wed, thu, fri]
    start: "09:00"
    duration_minutes: 30
    type: block

calendars:
  # Replace with your real Gmail/Workspace email
  primary_email: "you@example.com"
  # Replace with the Focus Sessions calendar ID
  # (looks like c_abcd1234@group.calendar.google.com), captured per
  # docs/google-oauth-setup.md §Step 8
  agent_writes_to: "REPLACE_WITH_FOCUS_SESSIONS_CALENDAR_ID"

  # OPTIONAL — explicit list of calendar IDs whose busy intervals the planner
  # treats as conflicts. When omitted, /plan-week defaults to every calendar
  # the user has access to (via list-calendars) minus `agent_writes_to`. The
  # safer-by-default behavior is to consider everything; set this list to
  # narrow the scope (e.g., ignore a noisy team-wide PTO calendar).
  #
  # conflict_sources:
  #   - "you@example.com"
  #   - "team-shared@example.com"
  #   - "partner@example.com"
